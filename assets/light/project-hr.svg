ems instead of a stale copy, with each tool</text><text x="480.0" y="166.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="400" fill="#3D3D3D">scoped to what it may touch.</text><text x="1200.0" y="54.0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" text-anchor="end" fill="#737373">LangChain</text><text x="1200.0" y="82.0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" text-anchor="end" fill="#737373">MCP</text><text x="1200.0" y="110.0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" text-anchor="end" fill="#737373">FastAPI</text><text x="1200.0" y="138.0" font-family="'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" text-anchor="end" fill="#737373">AWS</text></svg>
